[project]
name = "vlm-sop-monitor"
version = "0.1.0"
description = "Local-first video SOP monitoring with pluggable vision and VLM providers"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.7", "PyYAML>=6.0",
  "SQLAlchemy>=2.0", "numpy>=1.26,<2", "opencv-python-headless>=4.9,<5", "python-multipart>=0.0.9",
  "python-dotenv>=1.0"
]

[project.optional-dependencies]
vision = ["ultralytics>=8.3", "mediapipe>=0.10,<0.10.30", "onnxruntime>=1.18"]
local-vlm = ["transformers>=4.45", "torch>=2.2", "pillow>=10"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["E401", "E501", "E701", "E702"]
